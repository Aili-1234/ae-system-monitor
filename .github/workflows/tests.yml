name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 语法检查
        shell: bash
        run: |
          for f in js/*.js tests/*.js; do node --check "$f"; done

      - name: 回归测试（11 组）
        shell: bash
        run: |
          fail=0
          for f in tests/*.test.js; do
            echo "--- $f"
            node "$f" || fail=1
          done
          exit $fail
